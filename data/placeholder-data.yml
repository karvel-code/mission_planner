# PLACEHOLDER DATA - replace with TEC's YAML when it arrives.
# Planet values are real (NASA, mean radius and mean distance from the Sun).
# Spacecraft are invented, tuned so some routes are feasible and some are not.
#
# Units (assumed - confirm against the real file):
#   radius_km, distance_from_sun_km : kilometres, measured centre to centre
#   speed_kmh                       : kilometres per hour, constant
#   range_km                        : total range budget in km of "range units"
#   capacity                        : max passengers (crew excluded - assumption)

planets:
  - name: Mercury
    radius_km: 2439.7
    distance_from_sun_km: 57909227
  - name: Venus
    radius_km: 6051.8
    distance_from_sun_km: 108209475
  - name: Earth
    radius_km: 6371.0
    distance_from_sun_km: 149598262
  - name: Mars
    radius_km: 3389.5
    distance_from_sun_km: 227943824
  - name: Jupiter
    radius_km: 69911
    distance_from_sun_km: 778340821
  - name: Saturn
    radius_km: 58232
    distance_from_sun_km: 1426666422
  - name: Uranus
    radius_km: 25362
    distance_from_sun_km: 2870658186
  - name: Neptune
    radius_km: 24622
    distance_from_sun_km: 4498396441

spacecraft:
  # Fast, small. Cannot reach Neptune one way with 4 passengers
  # (4.35e9 km x 1.168 = 5.08e9 > 3.5e9) - good "infeasible" test case.
  - name: Nyx Express
    capacity: 4
    speed_kmh: 300000
    range_km: 3500000000

  # Mid-size all-rounder.
  - name: Nyx Voyager
    capacity: 12
    speed_kmh: 120000
    range_km: 6000000000

  # Large and slow. Long tours can exceed the 42-year window.
  - name: Nyx Grand Tour
    capacity: 40
    speed_kmh: 60000
    range_km: 12000000000
