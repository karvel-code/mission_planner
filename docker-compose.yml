# Local development stack: Postgres, Rails API, and Vite web app.
#   docker compose up --build
# Web: http://localhost:5173   API: http://localhost:3000   Postgres: localhost:5433

name: mission_planner

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails db:seed && bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      # DB_* rather than DATABASE_URL: DATABASE_URL would also override the test
      # database name, so `rspec` inside this container would hit the dev database.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      CORS_ORIGINS: http://localhost:5173
      # The catalog lives at the repo root, outside ./api, so it is mounted separately.
      MISSION_DATA_PATH: /data/data.yml
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      # The dev server forwards /api to Rails (web/vite.config.ts).
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  db_data:
  web_node_modules:
